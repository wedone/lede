# MASELinK AP2600IFM ath79 单设备构建
# 触发：push 到 ap2600 分支或手动 workflow_dispatch
name: Build AP2600IFM

on:
  push:
    branches:
      - ap2600
    paths:
      - 'target/linux/ath79/**'
      - 'package/kernel/mac80211/**'
      - '.github/workflows/build-ap2600ifm.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build maselink_ap2600ifm
    runs-on: ubuntu-22.04

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt update
          sudo -E apt -y install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk gcc-multilib g++-multilib gettext genisoimage git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool llvm lrzsz msmtp ninja-build p7zip p7zip-full patch pkgconf python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev

      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure target
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_ath79=y
          CONFIG_TARGET_ath79_generic=y
          CONFIG_TARGET_ath79_generic_DEVICE_maselink_ap2600ifm=y
          # 纯 AP 精简：argon 为主题
          CONFIG_PACKAGE_luci-theme-argon=y
          EOF
          make defconfig
          grep -E 'CONFIG_TARGET_ath79_generic_DEVICE_maselink' .config

      - name: Download
        run: |
          make download -j$(nproc)
          # 强制清理 lzma-loader 编译缓存，确保 LOADER_FLASH_OFFS 改动真正生效
          make target/linux/clean || true
          rm -rf build_dir/target-*/*/lzma-loader build_dir/target-*/linux-ath79*lzma-loader
          rm -rf build_dir/target-mips*/linux-ath79_generic/loader-stamp
 
      - name: Compile
        env:
          FORCE_UNSAFE_CONFIGURE: '1'
        run: |
          make -j$(nproc) IGNORE_ERRORS=m || make -j1 IGNORE_ERRORS=m V=s

      # 复制一份带 commit 短 hash 的固件 + 导出 SHA8，避免固定文件名导致误用旧产物
      - name: Tag firmware with commit hash
        run: |
          SHA8=$(git rev-parse --short=8 HEAD)
          echo "SHA8=${SHA8}" >> "$GITHUB_ENV"
          cd bin/targets/ath79/generic
          for f in openwrt-ath79-generic-maselink_ap2600ifm-*squashfs-sysupgrade.bin \
                   openwrt-ath79-generic-maselink_ap2600ifm-*initramfs-kernel.bin; do
            [ -f "$f" ] || continue
            base="${f%.bin}"
            cp "$f" "${base}-${SHA8}.bin"
          done
          echo "=== tagged files ==="
          ls -l *-${SHA8}*.bin

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ap2600ifm-firmware-${{ env.SHA8 }}
          path: bin/targets/ath79/generic/

      - name: Upload failure logs (on error)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ap2600ifm-failure-logs
          path: |
            logs/
            build_dir/logs/
