# AP2600IFM ar71xx(4.14) 固件构建
# 分支: ap2600-ar71xx (基点 7883a5d2e = 7a50383ab~1, 2021-06, coolsnowwolf lede)
# 产物: bin/targets/ar71xx/generic/ 下所有 legacy 镜像(含 maselink-ap2600ifm)
name: Build AP2600IFM ar71xx

on:
  push:
    branches:
      - ap2600-ar71xx
  workflow_dispatch:

jobs:
  build:
    name: Build ar71xx (4.14) firmware
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ap2600-ar71xx

      - name: Install dependencies
        run: |
          sudo -E apt-get update
          sudo -E apt-get -y install build-essential asciidoc binutils bzip2 gawk gettext git libncurses-dev libz-dev patch python3 unzip zlib1g-dev libc6-dev-i386 subversion flex uglifyjs gcc-multilib g++-multilib p7zip p7zip-full msmtp libssl-dev texinfo libglib2.0-dev xmlto qemu-utils upx libelf-dev autoconf automake libtool autopoint device-tree-compiler antlr3 gperf swig file rsync wget curl
          sudo -E apt-get -y autoremove --purge
          sudo -E apt-get clean

      - name: Lock feeds to 2021-06 era (matching base commit)
        run: |
          # packages: 95bfd01f7 (2021-06-14), luci: a78b74784 (2021-06-14)
          sed -i 's#^src-git packages.*#src-git packages https://github.com/coolsnowwolf/packages^95bfd01f749929584b17a6969444840219efbdd4#' feeds.conf.default
          sed -i 's#^src-git luci.*#src-git luci https://github.com/coolsnowwolf/luci^a78b74784dc1d4a4007e3e21a79228d5192f0dad#' feeds.conf.default
          sed -i 's/^src-git routing/#src-git routing/' feeds.conf.default
          sed -i 's/^src-git telephony/#src-git telephony/' feeds.conf.default
          cat feeds.conf.default

      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate configuration (ar71xx/generic)
        run: |
          echo "CONFIG_TARGET_ar71xx=y" > .config
          echo "CONFIG_TARGET_ar71xx_generic=y" >> .config
          make defconfig

      - name: Make download
        run: |
          make download -j8
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile firmware
        run: |
          make -j$(nproc) || make -j1 V=s

      - name: Show artifacts
        run: |
          ls -la bin/targets/ar71xx/generic/ 2>/dev/null || true
          find bin/targets/ar71xx/generic/ -name "*ap2600*" -o -name "*maselink*" 2>/dev/null || true

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ar71xx-generic-firmware
          path: bin/targets/ar71xx/generic/
          if-no-files-found: error